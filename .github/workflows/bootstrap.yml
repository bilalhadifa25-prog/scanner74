name: Unpack uploaded bundle

on:
  push:
    paths: ['bundle.txz']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files, fonts and icons
        run: |
          tar xJf bundle.txz && git rm -q bundle.txz
          cd /tmp && npm pack @fontsource/ibm-plex-sans-arabic@5.3.0 @fontsource/ibm-plex-sans@5.3.0 > /dev/null
          mkdir ar la && tar xzf fontsource-ibm-plex-sans-arabic-5.3.0.tgz -C ar && tar xzf fontsource-ibm-plex-sans-5.3.0.tgz -C la
          cd "$GITHUB_WORKSPACE" && mkdir -p fonts
          for w in 400 500 600; do
            cp /tmp/ar/package/files/ibm-plex-sans-arabic-arabic-$w-normal.woff2 fonts/ar-$w.woff2
            cp /tmp/la/package/files/ibm-plex-sans-latin-$w-normal.woff2 fonts/la-$w.woff2
          done
          pip install -q pillow && python3 tools/make_icons.py
          ls -R fonts icons js
      - name: Commit and start the app builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack app files"
          git push
          gh workflow run build-apps.yml --ref main
